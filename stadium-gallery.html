<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clubline · Stadium gallery</title><style>body{background:#0e1921;color:#eef3f4;font:15px system-ui;margin:0}header{padding:24px 4vw;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}h1{margin:0;font-size:1.7rem}p{color:#b7c5ca}button{background:#e5484f;color:white;border:0;padding:11px 17px;font-weight:700}main{padding:0 4vw 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px}article{background:#182833;border:1px solid #546972}.render{height:240px;overflow:hidden}.render svg{height:100%;width:100%}.info{padding:10px 17px}h2{font-size:1.08rem;margin:4px 0}</style></head><body><header><div><h1>Clubline · Twelve modular grounds</h1><p>Each club starts with a different 32-section GROUNDS-section layout. Open the game’s Facilities tab to edit your own.</p></div><button id="toggle">Show night</button></header><main id="gallery"></main><script type="module">
import {sceneSvg,stadiumProfile} from './scene.js';
const league=await (await fetch('./data/league.json')).json(),places=['city','rail','gardens','city','gardens','rail','oldtown','university','oldtown','university','oldtown','oldtown'];let night=false;
function render(){document.querySelector('#gallery').innerHTML=league.clubs.map((c,i)=>`<article><div class="render">${sceneSvg(c,places[i],true,night,true)}</div><div class="info"><small>${c.capacity.toLocaleString('en-GB')} seats · ${places[i]}</small><h2>${c.name}</h2>${c.ground} · ${stadiumProfile(c).name}</div></article>`).join('');document.querySelector('#toggle').textContent=night?'Show day':'Show night'}
document.querySelector('#toggle').onclick=()=>{night=!night;render()};render();
</script></body></html>
